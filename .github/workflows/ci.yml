# Build and verify GR-DOS, and boot both floppy images in QEMU (decisions 13,
# 17 and 18). The job `ci` is the required status check on main. When a push
# to main carries a VERSION with no release yet, `release` tags that commit
# v<VERSION> and publishes the `gr-dos` artifact, exactly four assets (the
# 1.44 MB and 1.2 MB images, the ZIP and SHA256SUMS), as a GitHub Release.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shogo82148/actions-setup-perl@a99edab616eaa8a66bbc16363c77a83361e5f2ce # v1.44.3
        with:
          perl-version: 5.42.3
          enable-modules-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-jwasm', 'scripts/fetch-watcom', 'patches/jwasm/*.patch') }}

      - name: Install mtools and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mtools qemu-system-x86

      - name: Fetch tools
        run: |
          scripts/fetch-jwasm
          scripts/fetch-watcom

      - name: Build, and compare an unbranded build with the M1 reference
        run: |
          mkdir -p build
          make -j"$(nproc)" all check 2>&1 | tee build/make.log

      - name: Boot smoke test of both images in QEMU
        run: make test 2>&1 | tee build/test.log

      - name: Package the release assets
        run: |
          {
            echo "runner $ImageOS $ImageVersion"
            uname -srm
            head -1 build/linux/tests/smoke-1440k/qemu.version
          } > build/ci.info
          make dist DIST_LOGS="build/make.log build/test.log" DIST_INFO=build/ci.info
          cat build/linux/dist/gr-dos-*/BUILDINFO
          cd build/linux/release
          test "$(ls | wc -l)" -eq 4
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gr-dos
          path: build/linux/release/
          if-no-files-found: error

      # Unpacked, for debugging: the ZIP's tree, the logs and the QEMU
      # serial output of each smoke test, also when a step failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gr-dos-unpacked
          path: |
            build/make.log
            build/test.log
            build/linux/dist/
            build/linux/tests/smoke-*/
          if-no-files-found: warn

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for an unreleased version
        id: version
        run: |
          version=$(cat VERSION)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.version.outputs.new == 'true'
        with:
          name: gr-dos
          path: dist

      - name: Tag and release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version=${TAG#v}
          assets=(
            "dist/gr-dos-$version-1440k.img"
            "dist/gr-dos-$version-1200k.img"
            "dist/gr-dos-$version.zip"
            dist/SHA256SUMS
          )
          test "$(ls dist | wc -l)" -eq "${#assets[@]}"
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "GR-DOS $version" \
            --notes "Built by CI from $GITHUB_SHA. gr-dos-$version-1440k.img is a 3.5\" 1.44 MB boot floppy and gr-dos-$version-1200k.img a 5.25\" 1.2 MB one. gr-dos-$version.zip holds the system files, BUILDINFO (tool versions) and the build and test logs. SHA256SUMS covers the images and the ZIP."
